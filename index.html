<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCW Commerce — Admin & Sales Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="SCW Commerce documentation for sales reps and administrators">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --theme-color: #1B5078;
      --theme-color-secondary: #ED8326;
      --sidebar-nav-link-color--active: #ED8326;
      --sidebar-nav-link-border-color--active: #ED8326;
      --sidebar-nav-link-font-weight--active: bold;
      --sidebar-width: 280px;
      --sidebar-nav-strong-color: #1B5078;
      --sidebar-nav-strong-font-size: 0.9em;
      --sidebar-nav-strong-text-transform: uppercase;
      --sidebar-nav-strong-letter-spacing: 0.05em;
      --base-font-size: 15px;
      --heading-h1-color: #1B5078;
      --heading-h2-color: #1B5078;
      --heading-h3-color: #333;
      --blockquote-border-color: #ED8326;
      --notice-tip-border-color: #ED8326;
      --table-cell-border-color: #e5e7eb;
    }

    /* SCW branding */
    .sidebar .app-name-link img {
      max-width: 180px;
    }

    /* Better table styling */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table th {
      background: #f3f4f6;
      font-weight: 600;
      text-align: left;
    }
    table td, table th {
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
    }
    table tr:nth-child(even) {
      background: #f9fafb;
    }

    /* Code block in tables */
    table code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.85em;
    }

    /* Screenshot placeholder styling */
    blockquote p:first-child {
      font-style: italic;
      color: #6b7280;
    }

    /* Diagram styling */
    pre code {
      font-size: 0.82em;
      line-height: 1.4;
    }

    /* Cover page */
    section.cover {
      background: linear-gradient(135deg, #1B5078 0%, #00547A 100%) !important;
    }
    section.cover .cover-main a {
      border-color: #ED8326 !important;
      color: #ED8326 !important;
    }
    section.cover .cover-main a:hover {
      background: #ED8326 !important;
      color: white !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SCW Commerce',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3,
      },
      coverpage: true,
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true,
      },
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
