<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCW Commerce — Admin & Sales Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="SCW Commerce documentation for sales reps and administrators">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Base theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <style>
    :root {
      /* Brand colors */
      --scw-navy: #1B5078;
      --scw-navy-dark: #0D3B5E;
      --scw-navy-deeper: #091e36;
      --scw-orange: #ED8326;
      --scw-orange-hover: #d97520;
      --scw-orange-glow: rgba(237, 131, 38, 0.3);

      /* Theme overrides */
      --theme-color: var(--scw-navy);
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.7;
      --base-color: #1a1a2e;

      /* Content */
      --content-max-width: 860px;

      /* Headings */
      --heading-h1-font-weight: 700;
      --heading-h1-color: var(--scw-navy);
      --heading-h1-font-size: 2em;
      --heading-h2-font-weight: 600;
      --heading-h2-color: var(--scw-navy);
      --heading-h2-font-size: 1.5em;
      --heading-h2-border-color: #e5e7eb;
      --heading-h2-border-width: 1px;
      --heading-h2-margin: 2.5em 0 1em;
      --heading-h2-padding: 0 0 0.5em 0;
      --heading-h3-font-weight: 600;
      --heading-h3-color: #1f2937;
      --heading-h3-font-size: 1.2em;

      /* Sidebar */
      --sidebar-width: 280px;
      --sidebar-background: #fafbfc;
      --sidebar-border-color: #e5e7eb;
      --sidebar-border-width: 0 1px 0 0;
      --sidebar-padding: 24px 20px 20px;
      --sidebar-nav-link-color: #4b5563;
      --sidebar-nav-link-font-size: 0.88em;
      --sidebar-nav-link-font-weight: 500;
      --sidebar-nav-link-color--active: var(--scw-orange);
      --sidebar-nav-link-border-color--active: var(--scw-orange);
      --sidebar-nav-link-border-width--active: 3px;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-link-text-decoration--active: none;
      --sidebar-nav-link-color--hover: var(--scw-navy);
      --sidebar-nav-link-text-decoration--hover: none;
      --sidebar-nav-link-margin: 0 0 2px;
      --sidebar-nav-link-padding: 6px 12px;
      --sidebar-nav-link-border-style: solid;
      --sidebar-nav-link-border-width: 0 0 0 3px;
      --sidebar-nav-link-border-color: transparent;
      --sidebar-nav-strong-color: var(--scw-navy);
      --sidebar-nav-strong-font-size: 0.72em;
      --sidebar-nav-strong-text-transform: uppercase;
      --sidebar-nav-strong-letter-spacing: 0.08em;
      --sidebar-nav-strong-margin: 24px 0 8px 12px;

      /* Blockquotes */
      --blockquote-border-color: var(--scw-orange);
      --blockquote-border-width: 0 0 0 4px;
      --blockquote-background: #fff7ed;
      --blockquote-border-radius: 0 8px 8px 0;

      /* Code */
      --code-font-family: 'JetBrains Mono', 'Fira Code', monospace;
      --code-font-size: 0.82em;
      --code-inline-background: #f1f5f9;
      --code-inline-border-radius: 4px;
      --code-inline-color: #0f172a;
      --code-inline-padding: 2px 6px;
      --code-block-border-radius: 8px;
      --code-block-padding: 20px 24px;

      /* Notice */
      --notice-tip-border-color: var(--scw-orange);
      --notice-important-border-color: #ef4444;
    }

    /* ── Global ─────────────────────────────── */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ══════════════════════════════════════════
       COVER PAGE — Nuclear specificity overrides
       ══════════════════════════════════════════ */

    /* Kill the Docsify theme overlay/mask */
    section.cover::before,
    section.cover::after,
    .cover-main::before,
    .cover-main::after {
      display: none !important;
      content: none !important;
    }

    /* The actual cover background */
    section.cover {
      background: #091e36 !important;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(27, 80, 120, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(237, 131, 38, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0a1f37 0%, #091e36 40%, #060f1e 100%) !important;
      min-height: 100vh !important;
    }

    section.cover.show {
      background: #091e36 !important;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(27, 80, 120, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(237, 131, 38, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0a1f37 0%, #091e36 40%, #060f1e 100%) !important;
    }

    /* Cover mask — completely transparent */
    section.cover .mask {
      background: none !important;
      opacity: 0 !important;
    }

    /* Title */
    section.cover h1 {
      font-size: 3.5em !important;
      font-weight: 800 !important;
      letter-spacing: -0.04em !important;
      color: #ffffff !important;
      margin: 0 0 0.3em !important;
      line-height: 1.1 !important;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.3) !important;
    }

    /* Subtitle */
    section.cover blockquote {
      border: none !important;
      background: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    section.cover blockquote p {
      color: rgba(255, 255, 255, 0.6) !important;
      font-style: normal !important;
      font-size: 1.25em !important;
      font-weight: 300 !important;
      letter-spacing: 0.01em !important;
      margin: 0 0 2em !important;
    }

    /* Bullet list */
    section.cover ul {
      list-style: none !important;
      padding: 0 !important;
      margin: 0 0 2.5em !important;
      text-align: center !important;
    }
    section.cover ul li {
      color: rgba(255, 255, 255, 0.45) !important;
      font-size: 0.92em !important;
      padding: 5px 0 !important;
      font-weight: 400 !important;
    }
    section.cover ul li::before {
      content: '' !important;
      display: inline-block !important;
      width: 6px !important;
      height: 6px !important;
      background: var(--scw-orange) !important;
      border-radius: 50% !important;
      margin-right: 10px !important;
      vertical-align: middle !important;
    }

    /* CTA Buttons */
    section.cover .cover-main > a {
      transition: all 0.25s ease !important;
    }

    section.cover .cover-main > a:first-of-type {
      background: var(--scw-orange) !important;
      border: none !important;
      color: white !important;
      border-radius: 10px !important;
      padding: 14px 40px !important;
      font-weight: 600 !important;
      font-size: 1em !important;
      letter-spacing: 0.02em !important;
      box-shadow: 0 4px 24px rgba(237, 131, 38, 0.35), 0 0 0 0 rgba(237, 131, 38, 0) !important;
      text-decoration: none !important;
    }
    section.cover .cover-main > a:first-of-type:hover {
      background: var(--scw-orange-hover) !important;
      box-shadow: 0 6px 32px rgba(237, 131, 38, 0.45), 0 0 0 4px rgba(237, 131, 38, 0.1) !important;
      transform: translateY(-1px) !important;
    }

    section.cover .cover-main > a:last-of-type {
      border: 1px solid rgba(255,255,255,0.2) !important;
      color: rgba(255,255,255,0.7) !important;
      border-radius: 10px !important;
      padding: 14px 40px !important;
      font-weight: 500 !important;
      text-decoration: none !important;
      backdrop-filter: blur(4px) !important;
    }
    section.cover .cover-main > a:last-of-type:hover {
      border-color: rgba(255,255,255,0.5) !important;
      color: white !important;
      background: rgba(255,255,255,0.05) !important;
    }

    /* ── Sidebar brand ──────────────────────── */
    .sidebar .app-name-link {
      font-family: 'Inter', sans-serif !important;
      font-weight: 700 !important;
      font-size: 1.15em !important;
      color: var(--scw-navy) !important;
      letter-spacing: -0.02em !important;
      padding: 8px 12px 20px !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }

    .sidebar .app-name-link::before {
      content: '' !important;
      width: 32px !important;
      height: 32px !important;
      background: var(--scw-navy) !important;
      border-radius: 8px !important;
      display: inline-block !important;
      flex-shrink: 0 !important;
    }

    .sidebar .search {
      margin: 0 0 16px !important;
    }

    .sidebar .search input {
      border-radius: 8px !important;
      border: 1px solid #d1d5db !important;
      padding: 8px 12px !important;
      font-size: 0.85em !important;
      background: white !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }

    .sidebar .search input:focus {
      border-color: var(--scw-orange) !important;
      box-shadow: 0 0 0 3px rgba(237, 131, 38, 0.15) !important;
      outline: none !important;
    }

    /* ── Content area ───────────────────────── */
    .markdown-section {
      padding: 40px 48px 80px !important;
    }

    .markdown-section h1:first-child {
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--scw-navy);
    }

    /* ── Tables ──────────────────────────────── */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      margin: 1.5em 0;
      font-size: 0.9em;
    }
    table th {
      background: #f8fafc;
      font-weight: 600;
      text-align: left;
      color: var(--scw-navy);
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 16px;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    table td {
      padding: 11px 16px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
      line-height: 1.5;
    }
    table tr:last-child td {
      border-bottom: none;
    }
    table tr:hover td {
      background: #f8fafc;
    }
    table code {
      background: #f1f5f9;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 500;
    }

    /* ── Blockquotes ────────────────────────── */
    blockquote {
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      margin: 1.5em 0;
    }
    blockquote p {
      font-style: italic;
      color: #92400e;
      font-size: 0.88em;
      margin: 0;
    }

    /* ── Code blocks ─────────────────────────── */
    .markdown-section pre {
      background: #0f172a !important;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .markdown-section pre code {
      color: #e2e8f0 !important;
      font-size: 0.82em;
      line-height: 1.6;
    }

    /* ── Links ────────────────────────────────── */
    .markdown-section a {
      color: var(--scw-orange);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .markdown-section a:hover {
      border-bottom-color: var(--scw-orange);
    }

    /* ── HR ───────────────────────────────────── */
    .markdown-section hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 2.5em 0;
    }

    /* ── Strong text in lists ────────────────── */
    .markdown-section li strong {
      color: #1f2937;
    }

    /* ── Pagination ──────────────────────────── */
    .docsify-pagination-container {
      border-top: 1px solid #e5e7eb;
      margin-top: 3em;
      padding-top: 1.5em;
    }
    .pagination-item-title {
      font-weight: 600;
      color: var(--scw-navy);
    }

    /* ── Scrollbar ────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 24px 20px 60px !important;
      }
      section.cover h1 {
        font-size: 2.2em !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<span style="display:flex;align-items:center;gap:10px"><img src="https://www.getscw.com/images/logo/scw-logo.svg" alt="SCW" style="height:28px;filter:brightness(0) saturate(100%) invert(26%) sepia(50%) saturate(700%) hue-rotate(175deg)"> Docs</span>',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3,
      },
      coverpage: true,
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
